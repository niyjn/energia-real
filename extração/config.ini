# Parâmetros dos extratores. Credenciais NÃO ficam aqui: use o arquivo .env (DB_URL).

[banco]
schema_origem  = campo_real_energia   # banco operacional (somente leitura)
schema_raw     = raw                  # dado exatamente como chegou da fonte
schema_tratada = tratada              # dado tipado, com chave e grão definidos

[http]
user_agent = CampoRealEnergia-DW/1.0 (trabalho academico, Centro Universitario Campo Real)
timeout = 60                  # segundos por requisição
tentativas = 5                # total de tentativas por requisição
espera_base = 2               # espera = espera_base * 2^(tentativa-1) segundos
pausa_entre_requisicoes = 0.5 # segundos entre requisições bem-sucedidas
# seção alterada para configurar o fallback automático no motor de navegador (sabidez.py)
cliente = auto                # auto (tenta requests e usa sabidez se 403) | selenium | playwright | requests
motor_navegador = auto        # auto | selenium | playwright
browser = auto                # auto (detecta firefox/edge/chrome) | firefox | edge | chrome
headless = true               # true = executa o navegador em segundo plano

# --------------------------------------------------------------------------- #
# CCEE - PLD horário (API CKAN do portal de dados abertos, licença CC-BY 4.0)
# --------------------------------------------------------------------------- #
[ccee]
api_url   = https://dadosabertos.ccee.org.br/api/3/action
dataset   = pld_horario
anos      = 2025, 2026
page_size = 5000

# Opcional: fixe o resource_id de cada ano. Se vazio, é descoberto automaticamente via package_show.
[ccee_resource_ids]
# 2025 = 2a180a6b-f092-43eb-9f82-a48798b803dc
# 2026 = 3f279d6b-1069-42f7-9b0a-217b084729c4

# Nomes possíveis de cada coluna no recurso (primeiro que existir é usado, sem diferenciar maiúsculas).
# Se a CCEE mudar o layout, ajuste aqui sem mexer no código.
[ccee_colunas]
data       = DIA, DATA, DATA_HORA
hora       = HORA, HORARIO
submercado = SUBMERCADO
pld        = PLD_HORA, PLD
mes_ref    = MES_REFERENCIA

# --------------------------------------------------------------------------- #
# Open-Meteo - clima histórico horário (uso não comercial, com atribuição)
# --------------------------------------------------------------------------- #
[open_meteo]
url      = https://archive-api.open-meteo.com/v1/archive
inicio   = 2025-01-01
fim      =                    # vazio = hoje - atraso_dias
atraso_dias = 5               # o arquivo histórico tem alguns dias de atraso
reprocessar_ultimos_dias = 7  # os dias mais recentes podem ser revisados pela fonte
timezone = America/Sao_Paulo  # mesmo fuso das medições (horário de Brasília)
# caixa geográfica do Brasil: coordenadas fora dela são rejeitadas (ex.: latitude com sinal trocado)
lat_min = -34
lat_max = 6
lon_min = -74
lon_max = -34

# Correção documentada de coordenadas erradas no cadastro: COD_USINA = latitude, longitude
# Exemplo (a UFV-004 está com latitude positiva na origem; Janaúba/MG fica em -15.803, -43.308):
[open_meteo_coord_override]
CRE-UFV-004 = -15.803, -43.308
